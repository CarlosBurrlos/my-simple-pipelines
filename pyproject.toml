[project]
name = "my-simple-pipelines"
version = "0.1.0"
description = "Monorepo of small pipelines. First: catalog."
requires-python = ">=3.12,<3.13"
# Workspace packages (path deps) plus the catalog app's own runtime deps.
# The catalog pipeline is not an installed distribution — it is imported in
# place as pipelines.catalog.* from the repo root — so its third-party deps
# live here on the root project.
dependencies = [
    "imageops",
    "ledger",
    "tagging",
    "pillow>=10.4",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",       # FastAPI TestClient
]
# CLIP vision/text encoders — heavy (torch + weights). Opt in with:
#   uv sync --extra clip
clip = [
    "tagging[clip]",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
imageops = { workspace = true }
ledger = { workspace = true }
tagging = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "pipelines"]
python_files = ["test_*.py"]
pythonpath = ["."]        # so tests import pipelines.catalog.* in place
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E501"]
