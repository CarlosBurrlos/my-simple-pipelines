[project]
name = "ledger"
version = "0.1.0"
description = "SQLite ledger for the catalog pipeline: schema, migrations, connection helpers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-ulid>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledger"]
