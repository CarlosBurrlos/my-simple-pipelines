[project]
name = "tagging"
version = "0.1.0"
description = "Generic tagging primitives: palette matching, cosine shortlist, CLIP embed/score. Handed data, never reads domain config."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
]

# CLIP is heavy (torch + weights). It is a real dependency of the embedding and
# attribute layers, but kept as an extra so the pure-numpy parts (palette,
# cosine) install and test without pulling ~1GB. Install with: uv sync --extra clip
[project.optional-dependencies]
clip = [
    "open_clip_torch>=2.24",
    "torch>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tagging"]
