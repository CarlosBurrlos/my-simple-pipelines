[project]
name = "imageops"
version = "0.1.0"
description = "Self-contained image normalization and derivative encoding. Pure: path/numbers in, image out."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=10.4",
    "pillow-heif>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imageops"]
